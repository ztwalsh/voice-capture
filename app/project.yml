# XcodeGen spec for Harps.
#
# The Xcode project is generated from this file rather than committed, so the
# pbxproj never has to be hand-edited or diffed:
#
#   brew install xcodegen        # once
#   cd app && xcodegen generate  # writes Harps.xcodeproj
#
# Then open Harps.xcodeproj, or build from the command line:
#
#   xcodebuild -project app/Harps.xcodeproj -scheme Harps -configuration Debug build
#
# See app/README.md for permissions and the run loop.

name: Harps

options:
  bundleIdPrefix: dev.harps
  createIntermediateGroups: true
  deploymentTarget:
    # SpeechAnalyzer/SpeechTranscriber need macOS 26. This app only ever runs
    # on the one Mac it's built on, so there's no real cost to raising this
    # from 14.0 rather than carrying `@available` checks for a fallback path
    # nothing exercises.
    macOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Match what the source was written and verified against.
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Manual
  configs:
    Debug:
      # Ad-hoc signing: enough for a local build, and it gives the bundle a
      # stable-enough identity for the Microphone and Speech grants. The
      # Accessibility grant is still per-signature and will need re-adding
      # after rebuilds — app/README.md covers that trap.
      CODE_SIGN_IDENTITY: "-"
      ENABLE_HARDENED_RUNTIME: "NO"
    Release:
      # Direct distribution outside the Mac App Store (App Sandbox is
      # incompatible with the global hotkey + synthesized-paste insertion
      # this app is built around — see the entitlements file). Notarization
      # requires a real "Developer ID Application" certificate and the
      # hardened runtime; scripts/release.sh drives the actual
      # build → notarize → staple → DMG pipeline.
      CODE_SIGN_IDENTITY: "Developer ID Application"
      DEVELOPMENT_TEAM: HSZZQ94DM7
      ENABLE_HARDENED_RUNTIME: "YES"

targets:
  Harps:
    type: application
    platform: macOS
    sources:
      - path: Harps
        # Referenced through build settings below, not bundled as resources.
        excludes:
          - "Info.plist"
          - "Harps.entitlements"
    dependencies:
      - sdk: Speech.framework
      - sdk: Carbon.framework
      - sdk: ServiceManagement.framework
      - sdk: FoundationModels.framework
    settings:
      base:
        PRODUCT_NAME: Harps
        PRODUCT_BUNDLE_IDENTIFIER: dev.harps.Harps
        INFOPLIST_FILE: Harps/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: Harps/Harps.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.4.1"
        CURRENT_PROJECT_VERSION: "5"
        # PLAN.md: the App Sandbox and the Accessibility API do not coexist
        # usefully. Off means simply not adding the entitlement.
        ENABLE_APP_SANDBOX: "NO"
