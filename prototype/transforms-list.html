<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harps — Transforms, list</title>
<!--
  Transforms, list version — picked over the card grid and split-view
  alternatives. Per direct feedback: no subheadline, "New Transform" above
  the table, and both "new" and "edit existing" are their own page (a
  breadcrumb back to the list) rather than a modal — closer to how
  Transcripts' Library → Document works than a popover.
-->
<style>
@font-face { font-family: 'Geist'; font-style: normal; font-weight: 100 900; font-display: swap; src: url('./fonts/geist.woff2') format('woff2'); }
@font-face { font-family: 'Geist Mono'; font-style: normal; font-weight: 100 900; font-display: swap; src: url('./fonts/geist-mono.woff2') format('woff2'); }

:root {
  color-scheme: dark;
  --bg: #0d0d16; --side: #0a0a13; --sel: #1c1c24; --trough: #13131c;
  --hairline: rgba(255,255,255,0.075);
  --text: #fafafa; --text-muted: rgba(255,255,255,0.56);
  --text-subtle: rgba(255,255,255,0.44); --text-faint: rgba(255,255,255,0.30);
  --up: #4ADE80; --live: #130CEE;
  --font-sans: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  --desk-a: #2a3340; --desk-b: #171a20; --desk-c: #3a4657; --desk-d: #4a3f3a;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; font-family: var(--font-sans); color: var(--text);
  overflow: hidden; -webkit-font-smoothing: antialiased;
  display: flex; align-items: center; justify-content: center;
  background:
    radial-gradient(900px 620px at 14% 10%,  var(--desk-c), transparent 62%),
    radial-gradient(760px 520px at 88% 22%,  var(--desk-d), transparent 58%),
    radial-gradient(1000px 700px at 62% 96%, var(--desk-a), transparent 60%),
    var(--desk-b);
}
.win { width: min(1140px, 94vw); height: min(720px, 90vh); background: var(--bg); border-radius: 14px;
  box-shadow: 0 24px 70px 0 rgba(0,0,0,0.62), 0 0 0 1px rgba(255,255,255,0.09); overflow: hidden; display: flex; }

.side { flex: none; width: 236px; background: var(--side); border-right: 1px solid var(--hairline); display: flex; flex-direction: column; padding: 0 10px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 18px 10px 22px; }
.mark { width: 30px; height: 30px; border-radius: 9px; flex: none; background: var(--text); color: var(--bg); display: flex; align-items: center; justify-content: center; }
.wordmark { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
.tls { display: flex; gap: 7px; padding: 14px 10px 0; }
.tl { width: 11px; height: 11px; border-radius: 50%; background: var(--text-faint); opacity: .4; }
.navsec { display: flex; flex-direction: column; gap: 2px; padding-top: 26px; }
.nav { display: flex; align-items: center; gap: 11px; padding: 9px 11px; border-radius: 9px; cursor: pointer; color: var(--text-muted); font-size: 14px; font-weight: 450; }
.nav svg { flex: none; opacity: .62; }
.nav[aria-selected="true"] { background: var(--sel); color: var(--text); font-weight: 500; }
.nav[aria-selected="true"] svg { opacity: 1; }
.side-foot { margin-top: auto; border-top: 1px solid var(--hairline); padding: 10px; }

/* main pane */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.body { flex: 1; overflow-y: auto; }
.body-inner { max-width: 700px; margin: 0 auto; padding: 24px 32px 40px; }

/* ── list view ── */
.list-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; padding-top: 4px; }
.list-head h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.015em; margin: 0; }
.new-btn { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 8px; background: var(--text); color: var(--bg); font-family: var(--font-sans); font-size: 12.5px; font-weight: 600; cursor: pointer; border: none; }
.new-btn:hover { opacity: .9; }

.list { border-radius: 10px; background: var(--trough); border: 1px solid var(--hairline); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; border-bottom: 1px solid var(--hairline); transition: background-color .15s ease; }
.row:last-child { border-bottom: none; }
.row:hover { background: var(--sel); }
.row .info { flex: 1; min-width: 0; }
.row .name-line { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.row .name { font-size: 14px; font-weight: 500; color: var(--text); }
.row .tag { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--text-faint); border: 1px solid var(--hairline); border-radius: 5px; padding: 1.5px 6px; }
.row .desc { font-size: 12.5px; color: var(--text-subtle); line-height: 1.5; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .row-actions { display: flex; align-items: center; gap: 2px; opacity: 0; transition: opacity .12s ease-out; flex: none; }
.row:hover .row-actions { opacity: 1; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; padding: 5px; border-radius: 5px; background: transparent; border: none; color: var(--text-faint); cursor: pointer; }
.icon-btn:hover { color: var(--text); background: var(--sel); }
.icon-btn.danger:hover { color: var(--live); }
.row .chev { color: var(--text-faint); flex: none; display: flex; }

.sw { width: 36px; height: 21px; border-radius: 999px; background: var(--sel); position: relative; flex: none; cursor: pointer; transition: background-color .2s cubic-bezier(.22,1,.36,1); }
.sw::after { content: ''; position: absolute; top: 1.5px; left: 1.5px; width: 18px; height: 18px; border-radius: 50%; background: var(--bg); box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s cubic-bezier(.22,1,.36,1); }
.sw.on { background: var(--text); }
.sw.on::after { transform: translateX(15px); background: var(--side); }

/* ── editor view (its own page, breadcrumb back) ── */
.crumb { display: flex; align-items: center; gap: 6px; color: var(--text-faint); font-size: 12.5px; cursor: pointer; margin-bottom: 18px; width: fit-content; }
.crumb:hover { color: var(--text-subtle); }
.crumb svg { flex: none; }

.e-name-row { margin-bottom: 20px; }
.e-name-row input {
  width: 100%; background: transparent; border: none; outline: none; color: var(--text);
  font-size: 22px; font-weight: 600; font-family: var(--font-sans); letter-spacing: -0.015em; padding: 0;
}
.e-name-row input::placeholder { color: var(--text-faint); }
.e-name-row input:disabled { color: var(--text-faint); }

.field label { display: block; font-size: 11px; color: var(--text-faint); margin: 0 0 8px; font-family: var(--font-mono); letter-spacing: .04em; text-transform: uppercase; }
.field textarea {
  width: 100%; min-height: 200px; background: var(--trough); border: 1px solid var(--hairline); border-radius: 10px;
  padding: 14px; color: var(--text); font-family: var(--font-sans); font-size: 13.5px; line-height: 1.65; resize: vertical; outline: none;
}
.field textarea:disabled { color: var(--text-subtle); }
.field textarea::placeholder { color: var(--text-faint); }

.locked-note { display: flex; align-items: center; gap: 7px; margin-top: 10px; font-size: 12px; color: var(--text-faint); }

.e-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; }
.btn-primary { background: var(--text); color: var(--bg); border: none; padding: 8px 18px; border-radius: 8px; font-family: var(--font-sans); font-size: 12.5px; font-weight: 600; cursor: pointer; }
.btn-primary:hover { opacity: .9; }
.text-danger { display: inline-flex; align-items: center; gap: 6px; background: transparent; border: none; color: var(--text-faint); font-family: var(--font-sans); font-size: 12.5px; cursor: pointer; padding: 0; }
.text-danger:hover { color: var(--live); }

.hidden { display: none; }
</style>
</head>
<body>

<div class="win">
  <div class="side">
    <div class="tls"><span class="tl"></span><span class="tl"></span><span class="tl"></span></div>
    <div class="brand">
      <div class="mark"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5.6 2.6h4.8M5.6 13.4h4.8M8 2.6v10.8"/></svg></div>
      <div class="wordmark">Harps</div>
    </div>
    <div class="navsec">
      <div class="nav"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M8.5 4V20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M15.5 4V20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M4 8.5H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M4 15.5H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Overview</div>
      <div class="nav"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12.1716 3H8C6.34315 3 5 4.34315 5 6V18C5 19.6569 6.34315 21 8 21H16C17.6569 21 19 19.6569 19 18V9.82843C19 9.29799 18.7893 8.78929 18.4142 8.41421L13.5858 3.58579C13.2107 3.21071 12.702 3 12.1716 3Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M13 3.5V7C13 8.10457 13.8954 9 15 9H18.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M9 13H12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M9 17H15.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Transcripts</div>
      <div class="nav"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 10C16.6575 10 18 8.6575 18 7C18 5.3425 16.6575 4 15 4C13.3425 4 12 5.3425 12 7C12 8.6575 13.3425 10 15 10Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 7H4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M20 7H18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M9 20C10.6575 20 12 18.6575 12 17C12 15.3425 10.6575 14 9 14C7.3425 14 6 15.3425 6 17C6 18.6575 7.3425 20 9 20Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M6 17H4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M20 17H12.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Settings</div>
      <div class="nav" aria-selected="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>Transforms</div>
    </div>
    <div class="side-foot">
      <div class="nav"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M17.9961 14C19.6529 14 20.9961 12.6569 20.9961 11C20.9961 9.34318 19.6529 8.00003 17.9961 8.00003M12.8254 18C12.4136 19.1652 11.3023 20 9.99609 20C8.33924 20 6.99609 18.6569 6.99609 17V15.5M6.99829 6.50003V15.5M17.9961 7.10616V14.8939C17.9961 16.9253 16.0195 18.3694 14.0842 17.752L5.08424 14.8805C3.84044 14.4837 2.99609 13.328 2.99609 12.0225V9.97759C2.99609 8.67203 3.84044 7.51636 5.08424 7.11953L14.0842 4.2481C16.0195 3.63065 17.9961 5.07476 17.9961 7.10616Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Feedback</div>
    </div>
  </div>

  <div class="main">
    <div class="body">
      <div class="body-inner">

        <!-- ── list view ── -->
        <div id="view-list">
          <div class="list-head">
            <h1>Transforms</h1>
            <button class="new-btn" onclick="openEditor(null)">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              New Transform
            </button>
          </div>
          <div class="list" id="list"></div>
        </div>

        <!-- ── editor view (list vs. new/edit share this) ── -->
        <div id="view-editor" class="hidden">
          <div class="crumb" onclick="closeEditor()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Transforms
          </div>
          <div class="e-name-row">
            <input id="e-name" placeholder="Transform name" />
          </div>
          <div class="field">
            <label>Instructions</label>
            <textarea id="e-instr" placeholder="Describe what this transform should do to the raw transcript..."></textarea>
            <div class="locked-note" id="locked-note" style="display:none">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 11V8a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.8"/></svg>
              Built-in default — you can turn it off, but not edit its wording.
            </div>
          </div>
          <div class="e-foot">
            <button class="text-danger" id="e-delete" onclick="deleteCurrent()">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M5 6.5L5.80734 18.2064C5.91582 19.7794 7.22348 21 8.80023 21H15.1998C16.7765 21 18.0842 19.7794 18.1927 18.2064L19 6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M3.5 6H20.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M8.07092 5.74621C8.42348 3.89745 10.0485 2.5 12 2.5C13.9515 2.5 15.5765 3.89745 15.9291 5.74621" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              Delete
            </button>
            <button class="btn-primary" onclick="closeEditor()">Save</button>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
const TRANSFORMS = [
  { id: 'cleanup', name: 'General Clean-up', tag: 'Default', on: true, locked: true,
    desc: 'Removes filler words (um, uh), repeated words, and false starts.',
    body: 'Remove filler words like "um" and "uh", collapse repeated or restarted words, and tighten up out-loud thinking — but never change the meaning, facts, or tone of what was actually said.' },
  { id: 'bullets', name: 'Meeting Notes → Bullets', tag: null, on: false, locked: false,
    desc: 'Reformats a rambling recap into short bullet points.',
    body: 'Reformat the transcript into concise bullet points, one idea per line. Preserve names, dates, and numbers exactly.' },
  { id: 'formal', name: 'Formal Tone', tag: null, on: true, locked: false,
    desc: 'Rewrites casual phrasing into a more professional register.',
    body: 'Rewrite in a more formal, professional tone suitable for an email. Keep it concise — do not add new content.' },
  { id: 'noprofanity', name: 'Remove Profanity', tag: null, on: false, locked: false,
    desc: 'Swaps out swear words for milder alternatives.',
    body: 'Replace any profanity with a milder equivalent word. Leave everything else unchanged.' },
];

let editingId = null;
let isNew = false;

function renderList() {
  const list = document.getElementById('list');
  list.innerHTML = TRANSFORMS.map(t => `
    <div class="row" onclick="openEditor('${t.id}')">
      <div class="info">
        <div class="name-line"><span class="name">${t.name}</span>${t.tag ? `<span class="tag">${t.tag}</span>` : ''}</div>
        <div class="desc">${t.desc}</div>
      </div>
      <div class="row-actions">
        ${t.locked ? '' : `
        <button class="icon-btn danger" title="Delete" onclick="event.stopPropagation(); deleteFromList('${t.id}')">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M5 6.5L5.80734 18.2064C5.91582 19.7794 7.22348 21 8.80023 21H15.1998C16.7765 21 18.0842 19.7794 18.1927 18.2064L19 6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M3.5 6H20.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M8.07092 5.74621C8.42348 3.89745 10.0485 2.5 12 2.5C13.9515 2.5 15.5765 3.89745 15.9291 5.74621" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>`}
      </div>
      <span class="sw ${t.on ? 'on' : ''}" onclick="event.stopPropagation(); toggle('${t.id}')"></span>
      <span class="chev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </div>
  `).join('');
}

function toggle(id) {
  const t = TRANSFORMS.find(t => t.id === id);
  t.on = !t.on;
  renderList();
}

function deleteFromList(id) {
  const i = TRANSFORMS.findIndex(t => t.id === id);
  if (i > -1) TRANSFORMS.splice(i, 1);
  renderList();
}

function openEditor(id) {
  editingId = id;
  isNew = id === null;
  const t = isNew ? null : TRANSFORMS.find(t => t.id === id);
  document.getElementById('e-name').value = t ? t.name : '';
  document.getElementById('e-name').disabled = !!(t && t.locked);
  document.getElementById('e-instr').value = t ? t.body : '';
  document.getElementById('e-instr').disabled = !!(t && t.locked);
  document.getElementById('locked-note').style.display = (t && t.locked) ? 'flex' : 'none';
  document.getElementById('e-delete').style.display = (t && t.locked) ? 'none' : 'inline-flex';

  document.getElementById('view-list').classList.add('hidden');
  document.getElementById('view-editor').classList.remove('hidden');
  if (isNew) document.getElementById('e-name').focus();
}

function closeEditor() {
  if (isNew) {
    const name = document.getElementById('e-name').value.trim();
    const body = document.getElementById('e-instr').value.trim();
    if (name) {
      TRANSFORMS.push({ id: 'new-' + Date.now(), name, tag: null, on: true, locked: false,
        desc: body.slice(0, 80) || 'No description yet.', body });
    }
  } else if (editingId) {
    const t = TRANSFORMS.find(t => t.id === editingId);
    if (t && !t.locked) {
      t.name = document.getElementById('e-name').value.trim() || t.name;
      t.body = document.getElementById('e-instr').value.trim();
      t.desc = t.body.slice(0, 80) || t.desc;
    }
  }
  renderList();
  document.getElementById('view-editor').classList.add('hidden');
  document.getElementById('view-list').classList.remove('hidden');
  editingId = null; isNew = false;
}

function deleteCurrent() {
  const i = TRANSFORMS.findIndex(t => t.id === editingId);
  if (i > -1) TRANSFORMS.splice(i, 1);
  editingId = null; isNew = false;
  renderList();
  document.getElementById('view-editor').classList.add('hidden');
  document.getElementById('view-list').classList.remove('hidden');
}

renderList();
</script>
</body>
</html>
