<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harps — prototype catalog</title>
<style>
@font-face {
  font-family: 'Geist'; font-style: normal; font-weight: 100 900;
  font-display: swap; src: url('./fonts/geist.woff2') format('woff2');
}
@font-face {
  font-family: 'Geist Mono'; font-style: normal; font-weight: 100 900;
  font-display: swap; src: url('./fonts/geist-mono.woff2') format('woff2');
}

:root {
  color-scheme: light;
  --bg:            #f4f4f5;
  --surface:       #ffffff;
  --trough:        #f9f9f9;
  --hairline:      rgba(0, 0, 0, 0.08);
  --hairline-soft: rgba(0, 0, 0, 0.05);
  --text:          #0d0d0d;
  --text-muted:    #6c6c6c;
  --text-subtle:   #767676;
  --text-faint:    #8f8f8f;
  --label-mono:    #5e6073;
  --accent:        #E5484D;
  --elev-card:
    0 4px 42px 0 rgba(0, 0, 0, 0.06),
    0 2px  6px 0 rgba(0, 0, 0, 0.05),
    0 0 0 1px   rgba(0, 0, 0, 0.06);
  --font-sans: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg:            #0e0e0f;
    --surface:       #1c1c1e;
    --trough:        rgba(255, 255, 255, 0.04);
    --hairline:      rgba(255, 255, 255, 0.10);
    --hairline-soft: rgba(255, 255, 255, 0.06);
    --text:          #fbfbfb;
    --text-muted:    rgba(255, 255, 255, 0.62);
    --text-subtle:   rgba(255, 255, 255, 0.48);
    --text-faint:    rgba(255, 255, 255, 0.34);
    --label-mono:    rgba(255, 255, 255, 0.52);
    --accent:        #FF6369;
    --elev-card:     0 4px 24px 0 rgba(0,0,0,0.36), 0 0 0 1px rgba(255,255,255,0.08);
  }
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font-sans);
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
}

.wrap {
  max-width: 880px;
  margin: 0 auto;
  padding: 56px 28px 96px;
}

/* ── header ─────────────────────────────────────────── */
header { margin-bottom: 28px; }
h1 {
  font-size: 26px; font-weight: 600; letter-spacing: -0.02em;
  margin: 0 0 6px;
}
.sub {
  font-size: 13px; color: var(--text-subtle); margin: 0;
}
.sub a { color: var(--text-muted); }

/* ── toolbar ────────────────────────────────────────── */
.toolbar {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  margin: 24px 0 8px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--hairline);
}
.seg {
  display: inline-flex; background: var(--trough);
  border: 1px solid var(--hairline); border-radius: 9px; padding: 2px;
}
.seg button {
  font-family: var(--font-sans); font-size: 12px; font-weight: 500;
  color: var(--text-muted); background: transparent; border: 0;
  border-radius: 7px; padding: 5px 12px; cursor: pointer;
  transition: background-color 150ms ease, color 150ms ease;
}
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] {
  background: var(--surface); color: var(--text);
  box-shadow: 0 1px 2px rgba(0,0,0,0.06), 0 0 0 1px var(--hairline-soft);
}
.count {
  font-size: 12px; color: var(--text-faint);
  font-family: var(--font-mono); letter-spacing: -0.01em;
}
.spacer { flex: 1; }
.linkbtn {
  font-family: var(--font-sans); font-size: 12px; font-weight: 500;
  color: var(--text-muted); background: transparent;
  border: 0; cursor: pointer; padding: 4px 2px;
  text-decoration: underline; text-underline-offset: 2px;
  text-decoration-color: var(--hairline);
}
.linkbtn:hover { color: var(--text); text-decoration-color: currentColor; }

/* ── groups ─────────────────────────────────────────── */
.group { margin-top: 34px; }
.group-label {
  font-family: var(--font-mono); font-size: 11px; font-weight: 500;
  letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--label-mono); margin-bottom: 12px;
}

/* ── cards ──────────────────────────────────────────── */
.card {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 14px 18px;
  align-items: start;
  background: var(--surface);
  border-radius: 12px;
  box-shadow: var(--elev-card);
  padding: 18px 20px;
  margin-bottom: 12px;
  transition: opacity 150ms ease;
}
.card.is-archived { opacity: 0.52; }
.card-main { min-width: 0; }
.card-title {
  font-size: 15px; font-weight: 600; letter-spacing: -0.01em;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.card-title a { color: var(--text); text-decoration: none; }
.card-title a:hover { text-decoration: underline; text-underline-offset: 2px; }
.card-desc {
  font-size: 13px; color: var(--text-muted); margin: 5px 0 0;
}
.card-meta {
  font-family: var(--font-mono); font-size: 11px; color: var(--text-faint);
  margin-top: 9px; display: flex; gap: 12px; flex-wrap: wrap;
}
.card-meta .file { color: var(--text-subtle); }

/* badges */
.badge {
  font-family: var(--font-mono); font-size: 10px; font-weight: 500;
  letter-spacing: 0.03em; text-transform: uppercase;
  padding: 2px 6px; border-radius: 5px;
  border: 1px solid var(--hairline); color: var(--text-subtle);
  white-space: nowrap;
}
.badge.latest { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.badge.superseded { color: var(--text-faint); }

/* actions */
.card-actions { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
.btn {
  font-family: var(--font-sans); font-size: 12px; font-weight: 500;
  color: var(--text); background: var(--trough);
  border: 1px solid var(--hairline); border-radius: 8px;
  padding: 7px 12px; cursor: pointer; white-space: nowrap; text-align: center;
  text-decoration: none; display: inline-block;
  transition: background-color 150ms ease, border-color 150ms ease;
}
.btn:hover { background: var(--hairline-soft); }
.btn.primary { background: var(--text); color: var(--surface); border-color: var(--text); }
.btn.primary:hover { opacity: 0.9; background: var(--text); }
.btn.ghost { background: transparent; }

.empty {
  text-align: center; color: var(--text-subtle); font-size: 13px;
  padding: 60px 20px;
}

@media (max-width: 560px) {
  .card { grid-template-columns: 1fr; }
  .card-actions { flex-direction: row; }
  .card-actions .btn { flex: 1; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Harps — prototype catalog</h1>
    <p class="sub">Phase 1 design prototypes. See <a href="./README.md">README.md</a> for what each one settles. Archive state is stored in this browser only.</p>
  </header>

  <div class="toolbar">
    <div class="seg" role="tablist" aria-label="Filter prototypes">
      <button data-filter="active" aria-pressed="true">Active</button>
      <button data-filter="archived" aria-pressed="false">Archived</button>
      <button data-filter="all" aria-pressed="false">All</button>
    </div>
    <span class="count" id="count"></span>
    <span class="spacer"></span>
    <button class="linkbtn" id="archiveSuperseded">Archive superseded versions</button>
    <button class="linkbtn" id="resetArchive">Reset</button>
  </div>

  <div id="groups"></div>
  <div class="empty" id="empty" hidden></div>
</div>

<script>
(function () {
  'use strict';

  // ── manifest ──────────────────────────────────────────────
  // stage: 'latest' | 'current' | 'exploration' | 'superseded'
  const PROTOS = [
    {
      file: 'capture-v2.html',
      title: 'Capture — second pass',
      desc: 'The capsule in the main window’s visual language, invoked from the menu bar or the hotkey. Two interactions, not one with two triggers.',
      group: 'Capture', stage: 'latest', updated: '2026-09-06',
    },
    {
      file: 'capsule.html',
      title: 'Capsule — full loop',
      desc: 'The adopted Phase 1 direction end to end: capture, insert at the caret, history window. Live microphone and amplitude mapping.',
      group: 'Capture', stage: 'current', updated: '2026-09-06',
    },
    {
      file: 'versions.html',
      title: 'Capsule — three directions',
      desc: 'Pill, Bar and Mono side by side on one microphone feed, so they can be judged on the same audio at the same moment.',
      group: 'Capture', stage: 'exploration', updated: '2026-09-06',
    },
    {
      file: 'dim.html',
      title: 'Background treatments',
      desc: 'What the rest of the screen does while you dictate — five treatments (scrim, fade, blur, vignette, none) on one intensity control.',
      group: 'Capture', stage: 'exploration', updated: '2026-09-06',
    },
    {
      file: 'library-v2.html',
      title: 'Main window — second pass',
      desc: 'Sidebar, Overview, settings and a live .md toggle. Reworked against the MonRize dashboard and a markdown notes app.',
      group: 'Main window', stage: 'latest', updated: '2026-09-06',
    },
    {
      file: 'library.html',
      title: 'Main window — first pass',
      desc: 'Library and Document layouts over one set of transcripts, switchable in the toolbar.',
      group: 'Main window', stage: 'superseded', supersededBy: 'library-v2.html', updated: '2026-09-06',
    },
  ];

  const GROUP_ORDER = ['Capture', 'Main window'];
  const KEY = 'harps.prototype.archived';

  // ── archive state (localStorage) ──────────────────────────
  function loadArchived() {
    try {
      const raw = localStorage.getItem(KEY);
      return new Set(raw ? JSON.parse(raw) : []);
    } catch (e) { return new Set(); }
  }
  function saveArchived(set) {
    try { localStorage.setItem(KEY, JSON.stringify([...set])); } catch (e) {}
  }
  let archived = loadArchived();
  let filter = 'active';

  // ── render ────────────────────────────────────────────────
  const groupsEl = document.getElementById('groups');
  const emptyEl = document.getElementById('empty');
  const countEl = document.getElementById('count');

  function visibleFor(p) {
    const isArch = archived.has(p.file);
    if (filter === 'active') return !isArch;
    if (filter === 'archived') return isArch;
    return true;
  }

  function stageBadge(p) {
    if (p.stage === 'latest') return '<span class="badge latest">latest</span>';
    if (p.stage === 'current') return '<span class="badge latest">adopted</span>';
    if (p.stage === 'superseded') return '<span class="badge superseded">superseded</span>';
    return '<span class="badge">exploration</span>';
  }

  function render() {
    groupsEl.innerHTML = '';
    let shown = 0;

    GROUP_ORDER.forEach(function (g) {
      const items = PROTOS.filter(function (p) { return p.group === g && visibleFor(p); });
      if (!items.length) return;
      shown += items.length;

      const wrap = document.createElement('section');
      wrap.className = 'group';
      const label = document.createElement('div');
      label.className = 'group-label';
      label.textContent = g;
      wrap.appendChild(label);

      items.forEach(function (p) {
        const isArch = archived.has(p.file);
        const card = document.createElement('div');
        card.className = 'card' + (isArch ? ' is-archived' : '');

        const supersededNote = p.supersededBy
          ? '<span>superseded by ' + p.supersededBy + '</span>' : '';

        card.innerHTML =
          '<div class="card-main">' +
            '<div class="card-title"><a href="./' + p.file + '">' + p.title + '</a>' + stageBadge(p) + '</div>' +
            '<p class="card-desc">' + p.desc + '</p>' +
            '<div class="card-meta"><span class="file">' + p.file + '</span><span>updated ' + p.updated + '</span>' + supersededNote + '</div>' +
          '</div>' +
          '<div class="card-actions">' +
            '<a class="btn primary" href="./' + p.file + '">Open</a>' +
            '<button class="btn ghost" data-toggle="' + p.file + '">' + (isArch ? 'Restore' : 'Archive') + '</button>' +
          '</div>';

        wrap.appendChild(card);
      });

      groupsEl.appendChild(wrap);
    });

    const total = PROTOS.length;
    countEl.textContent = shown + ' of ' + total + ' · ' + archived.size + ' archived';

    emptyEl.hidden = shown > 0;
    if (!shown) {
      emptyEl.textContent = filter === 'archived'
        ? 'Nothing archived yet.'
        : 'Nothing to show under this filter.';
    }
  }

  // ── events ────────────────────────────────────────────────
  document.querySelectorAll('.seg button').forEach(function (b) {
    b.addEventListener('click', function () {
      filter = b.dataset.filter;
      document.querySelectorAll('.seg button').forEach(function (o) {
        o.setAttribute('aria-pressed', String(o === b));
      });
      render();
    });
  });

  groupsEl.addEventListener('click', function (e) {
    const btn = e.target.closest('[data-toggle]');
    if (!btn) return;
    const file = btn.dataset.toggle;
    if (archived.has(file)) archived.delete(file);
    else archived.add(file);
    saveArchived(archived);
    render();
  });

  document.getElementById('archiveSuperseded').addEventListener('click', function () {
    PROTOS.forEach(function (p) {
      if (p.stage === 'superseded' || p.supersededBy) archived.add(p.file);
    });
    saveArchived(archived);
    render();
  });

  document.getElementById('resetArchive').addEventListener('click', function () {
    archived = new Set();
    saveArchived(archived);
    render();
  });

  render();
})();
</script>
</body>
</html>
